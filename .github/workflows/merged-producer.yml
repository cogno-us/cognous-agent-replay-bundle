name: Merged producer compatibility Linux
on:
  push:
    paths:
      - 'src/agent_replay_bundle/importers.py'
      - 'scripts/generate_producer_v2_examples.py'
      - 'qualification/test_merged_producer.py'
      - '.github/workflows/merged-producer.yml'
  pull_request:
    paths:
      - 'src/agent_replay_bundle/importers.py'
      - 'scripts/generate_producer_v2_examples.py'
      - 'qualification/test_merged_producer.py'
      - '.github/workflows/merged-producer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: replay
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: d3dadee70bd319812b207389ab1e0f6efe511916
          path: control-plane
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: c3c3ee7188b9367cf70b08074b9c40a5c70c94ac
          path: executor
      - uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-action-manifest
          ref: 46c950bed37fe3812000895430bc0312d29e37ce
          path: manifest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: replay
        run: timeout 180 python -m pip install -e '.[dev]'
      - name: Qualify actual merged producers
        working-directory: replay
        env:
          ARB_V2_CONTROL_PLANE_ROOT: ${{ github.workspace }}/control-plane
          ARB_V2_MOLTBOT_ROOT: ${{ github.workspace }}/executor
          ARB_PINNED_MANIFEST_FIXTURE: ${{ github.workspace }}/manifest/examples/refund_integration_v1_1.manifest.json
          ARB_MERGED_RESULTS: ${{ github.workspace }}/replay/results/merged-producer
        run: timeout 120 python -m pytest -q qualification/test_merged_producer.py --junitxml=results/merged-producer.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merged-producer-compatibility
          path: replay/results
          if-no-files-found: error
