name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Agent Replay Bundle
        uses: actions/checkout@v4
        with:
          path: replay-bundle

      - name: Checkout pinned Control Plane
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: 283500652d47a692fb0b99a1172a6d5faffbd9a7
          path: pinned/control-plane

      - name: Checkout pinned Moltbot Safe
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 1d308faf664c504b6e310db3c7a310153ef7b067
          path: pinned/moltbot-safe

      - name: Checkout accepted Control Plane observation repair
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: 2ea9528eeb87e14ff10f05de06473122b9df540f
          path: pinned/control-plane-v2

      - name: Checkout accepted Control Plane persistence repair
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: 248d899634d9db3518e831bc7ab568a48733f825
          path: pinned/control-plane-v2-persistence

      - name: Checkout accepted executor producer 2.0.0
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-execution-runtime
          ref: 177354e959cc78c59c1a776f018cfbfbf28c927b
          path: pinned/moltbot-v2

      - name: Checkout pinned Manifest
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-action-manifest
          ref: 46c950bed37fe3812000895430bc0312d29e37ce
          path: pinned/manifest

      - name: Checkout pinned Alvorada
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-institutional-governance
          ref: fb3d97938969a89e149e8ff8db2756091d1233fc
          path: pinned/alvorada

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify pinned revisions
        shell: bash
        run: |
          test "$(git -C pinned/control-plane rev-parse HEAD)" = "283500652d47a692fb0b99a1172a6d5faffbd9a7"
          test "$(git -C pinned/moltbot-safe rev-parse HEAD)" = "1d308faf664c504b6e310db3c7a310153ef7b067"
          test "$(git -C pinned/control-plane-v2 rev-parse HEAD)" = "2ea9528eeb87e14ff10f05de06473122b9df540f"
          test "$(git -C pinned/control-plane-v2-persistence rev-parse HEAD)" = "248d899634d9db3518e831bc7ab568a48733f825"
          test "$(git -C pinned/moltbot-v2 rev-parse HEAD)" = "177354e959cc78c59c1a776f018cfbfbf28c927b"
          test "$(git -C pinned/manifest rev-parse HEAD)" = "46c950bed37fe3812000895430bc0312d29e37ce"
          test "$(git -C pinned/alvorada rev-parse HEAD)" = "fb3d97938969a89e149e8ff8db2756091d1233fc"

      - name: Install package with dev extras
        working-directory: replay-bundle
        run: pip install -e ".[dev]"

      - name: Install pinned Control Plane runtime dependencies
        run: pip install -e pinned/control-plane

      - name: Run focused persistence compatibility qualification
        working-directory: replay-bundle
        env:
          ARB_V2_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane-v2
          ARB_V2_PERSISTENCE_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane-v2-persistence
          ARB_V2_MOLTBOT_ROOT: ${{ github.workspace }}/pinned/moltbot-v2
          ARB_PINNED_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane
          ARB_PINNED_MOLTBOT_ROOT: ${{ github.workspace }}/pinned/moltbot-safe
          ARB_PINNED_MANIFEST_FIXTURE: ${{ github.workspace }}/pinned/manifest/examples/refund_integration_v1_1.manifest.json
        run: pytest -q tests/test_producer_v2_persistence.py

      - name: Run unit and pinned integration tests
        working-directory: replay-bundle
        env:
          ARB_V2_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane-v2
          ARB_V2_PERSISTENCE_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane-v2-persistence
          ARB_V2_MOLTBOT_ROOT: ${{ github.workspace }}/pinned/moltbot-v2
          ARB_PINNED_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane
          ARB_PINNED_MOLTBOT_ROOT: ${{ github.workspace }}/pinned/moltbot-safe
          ARB_PINNED_MANIFEST_FIXTURE: ${{ github.workspace }}/pinned/manifest/examples/refund_integration_v1_1.manifest.json
        run: pytest -ra

      - name: Generate pinned reconstruction examples
        if: matrix.python-version == '3.12'
        working-directory: replay-bundle
        env:
          ARB_V2_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane-v2
          ARB_V2_PERSISTENCE_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane-v2-persistence
          ARB_V2_MOLTBOT_ROOT: ${{ github.workspace }}/pinned/moltbot-v2
          ARB_PINNED_CONTROL_PLANE_ROOT: ${{ github.workspace }}/pinned/control-plane
          ARB_PINNED_MOLTBOT_ROOT: ${{ github.workspace }}/pinned/moltbot-safe
          ARB_PINNED_MANIFEST_FIXTURE: ${{ github.workspace }}/pinned/manifest/examples/refund_integration_v1_1.manifest.json
        run: |
          python scripts/generate_reconstruction_examples.py --output-dir generated-examples
          python scripts/generate_producer_v2_examples.py --output-dir generated-examples/producer-v2

      - name: Upload pinned reconstruction examples
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-examples-${{ github.sha }}
          path: replay-bundle/generated-examples/**/*.json
          if-no-files-found: error

      - name: Check examples
        working-directory: replay-bundle
        run: arb check-examples
